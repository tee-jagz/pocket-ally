<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1240" viewBox="0 0 1440 1240" role="img" aria-labelledby="title desc">
<title id="title">Pocket Ally workflow and APIs</title><desc id="desc">Incoming messages use Responses extraction and Decisions routing. Journal notes, Audio transcription, embeddings and requested TfL plans support an agent-prepared result. The user edits and approves an exact local email copy. Images generate companion previews chosen by the user.</desc>
