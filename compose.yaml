services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: pocketally
      POSTGRES_USER: pocketally
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - diary:/var/lib/postgresql/data
volumes:
  diary:
